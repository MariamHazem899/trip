<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather............</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="search-sidebar">
            <div class="brand-zone">
                <h3 id="welcome-message">لوحة الطقس</h3>
            </div>

            <div class="search-group">
                <div class="input-wrapper">
                    <input type="text" id="search-input" placeholder="ابحث عن مدينة...">
                    <button id="geo-btn" class="geo-btn" title="موقعي الحالي">📍</button>
                </div>
                <button id="search-btn">بحث</button>
            </div>

            <div id="error-box" class="error-box hidden"></div>

            <div class="history-section">
                <h4>المحطات الأخيرة</h4>
                <div id="history-list"></div>
            </div>
        </aside>

        <main class="main-display">
            <section id="weather-hero" class="weather-hero">
                <div class="empty-state">جاري قراءة تفاصيل الطقس الحية...</div>
            </section>

            <section class="forecast-section">
                <h4>التوقعات لـ 5 أيام قادمة</h4>
                <div id="forecast-grid" class="forecast-grid"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
